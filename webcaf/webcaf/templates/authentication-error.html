{% extends "base.html" %}

{% block title %}There is a problem signing you in {{ block.super }}{% endblock %}

{% block content %}
    <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
            <h1 class="govuk-heading-xl">There is a problem signing you in</h1>
            <p class="govuk-body">Try signing in again. If the problem continues, contact the WebCAF support team.</p>
            <a class="govuk-button" data-module="govuk-button" href="{% url 'one_login:login' %}">Try again</a>
        </div>
    </div>
{% endblock %}
