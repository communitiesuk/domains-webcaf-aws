name: Build & Deploy Webcaf to Sandbox

#Run this workflow when a feature branch is merged into main. Image is deployed to staging environment.
on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

jobs:
  build-and-push:
    name: CI - Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Figure out the image name based on the tag
      - name: Derive image name
        id: image_name
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_IMAGE="web-caf-app-ecr"

          echo "Image name is : $BASE_IMAGE"
          echo "IMAGE_NAME=$BASE_IMAGE" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.STAGE_ACCOUNT_ID }}:role/github-actions-ecr-role-web-caf-app-ecr"
          aws-region: eu-west-2
      - name: Ensure release tag is from main
        run: |
          if [ "${GITHUB_EVENT_BASE_REF}" != "refs/heads/main" ]; then
            echo "❌ Release tags must be created from main branch only."
            echo "This tag (${GITHUB_REF_NAME}) came from ${GITHUB_EVENT_BASE_REF}"
            #exit 0
          fi
      - name: Log in to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build, Tag, and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          IMAGE_NAME: ${{ steps.image_name.outputs.IMAGE_NAME }}
          GOV_UK_ONE_LOGIN_PRIVATE_KEY: ${{ secrets.GOV_UK_ONE_LOGIN_PRIVATE_KEY }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}   # short commit SHA as the tag
          echo "Pushing image: $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker buildx build --platform linux/amd64 \
          --build-arg GOV_UK_ONE_LOGIN_PRIVATE_KEY="$GOV_UK_ONE_LOGIN_PRIVATE_KEY" \
          -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
          -t $ECR_REGISTRY/$IMAGE_NAME:latest  \
          . --push;
          # Output the image URI for the CD job
          echo "image-uri=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"" >> $GITHUB_OUTPUT

  deploy-sandbox:
      name: CD - Deploy to ECS
      runs-on: ubuntu-latest
      needs: build-and-push
     
      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.STAGE_ACCOUNT_ID }}:role/github-actions-ecr-role-web-caf-app-ecr"
          aws-region: eu-west-2

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: default-webcaf-sandbox-revision.json
          container-name: webcaf
          image: ${{ needs.build-and-push.outputs.image-uri }}
          # Pass non-sensitive environment variables
          environment-variables: |
            DEBUG=$${{ vars.GOV_UK_ONE_LOGIN_PRIVATE_KEY_PATH }}
            ENVIRONMENT=$${{ vars.ENVIRONMENT }}
            GOV_UK_ONE_LOGIN_ENVIRONMENT=$${{ vars.GOV_UK_ONE_LOGIN_ENVIRONMENT }}
            GOV_UK_ONE_LOGIN_OPENID_CONFIG_URL=$${{ vars.GOV_UK_ONE_LOGIN_OPENID_CONFIG_URL }}
            GOV_UK_ONE_LOGIN_PRIVATE_KEY_PATH=$${{ vars.GOV_UK_ONE_LOGIN_PRIVATE_KEY_PATH }}
            GOV_UK_ONE_LOGIN_SCOPE=$${{ vars.GOV_UK_ONE_LOGIN_SCOPE }}
            SSO_MODE=$${{ vars.SSO_MODE }}
          # Pass secrets 
          secrets: |
            GOV_UK_ONE_LOGIN_CLIENT_ID=${{ secrets.GOV_UK_ONE_LOGIN_CLIENT_ID }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.rendered-task-definition }}
          service: webcaf-sandbox
          cluster: default
          wait-for-service-stability: true