x-common-application-variables: &common-application-variables
  DEBUG: "True"
  SECRET_KEY: "Unneeded"  # pragma: allowlist secret
  DJANGO_SETTINGS_MODULE: webcaf.settings
  DATABASE_URL: postgresql://webcaf:webcaf@postgres:5432/webcaf  # pragma: allowlist secret
  ENVIRONMENT: 'local'
  GOOGLE_ANALYTICS_ID: GTM-TEST

x-api-base: &api-base
  platform: linux/amd64
  build:
    context: .
    args:
      POETRY_ARGS: "--no-root --no-ansi"

services:
  web:
    platform: linux/amd64
    <<: *api-base
    ports:
      - "8010:8000"
    #Added the reload flag so the application will be reloaded when the source is modified.
    entrypoint: [ "/usr/local/bin/gunicorn", "webcaf.wsgi:application", "--bind", "0.0.0.0:8000", "--timeout", "120", "--access-logfile", "-", "--reload" ]
    environment:
      <<: *common-application-variables
      PYTHONBREAKPOINT: "ipdb.set_trace"
      SSO_MODE: dex
    volumes:
      - .:/app
      - webcaf_home:/home/webcaf
      - static-data:/app/webcaf/static
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      oauth:
        condition: service_started

  postgres:
    platform: linux/amd64
    image: postgres:18-alpine
    ports:
      - 54321:5432
    environment:
      POSTGRES_USER: webcaf
      POSTGRES_PASSWORD: webcaf  # pragma: allowlist secret
      POSTGRES_DB: webcaf
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  oauth:
    image: ghcr.io/dexidp/dex:latest
    container_name: dex
    ports:
      - "5556:5556"  # Dex HTTP server
    volumes:
      - ./oauth-stub:/etc/dex
    command: [ "dex", "serve", "/etc/dex/config.yaml" ]

  one-login-simulator:
    profiles: [ "one-login-simulator" ]
    image: ghcr.io/govuk-one-login/simulator:26.09.16@sha256:1f0930e04ced60b624c1b4e830cbe0a622be216b5065ece4756dbebdb0e92a60
    ports:
      - "3000:3000"
    environment:
      CLIENT_ID: webcaf-local
      SCOPES: openid,email
      REDIRECT_URLS: http://localhost:8010/one-login/callback/
      POST_LOGOUT_REDIRECT_URLS: http://localhost:8010/
      CLIENT_LOCS: P0
      IDENTITY_VERIFICATION_SUPPORTED: "false"
      ID_TOKEN_SIGNING_ALGORITHM: ES256
      TOKEN_AUTH_METHOD: private_key_jwt
      SIMULATOR_URL: http://localhost:3000
      SUB: ${ONE_LOGIN_SIMULATOR_SUB:-urn:fdc:gov.uk:2022:EoM4c_EsB2Yo_NoV5leoJwlkOtcQk2nI74F1Y4EZ_Tw}
      EMAIL: ${ONE_LOGIN_SIMULATOR_EMAIL:-alice@example.gov.uk}
      EMAIL_VERIFIED: ${ONE_LOGIN_SIMULATOR_EMAIL_VERIFIED:-true}
      INTERACTIVE_MODE: ${ONE_LOGIN_SIMULATOR_INTERACTIVE_MODE:-true}
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/.well-known/openid-configuration').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  init:
    <<: *api-base
    restart: 'no'
    environment:
      <<: *common-application-variables
      SSO_MODE: dex
    entrypoint: [ "/bin/sh", "/app/local-init.sh" ]
    volumes:
      - .:/app
      - static-data:/app/webcaf/static
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: { }
  webcaf_home: { }
  static-data: { }
