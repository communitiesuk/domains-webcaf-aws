repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        args: [ --allow-multiple-documents ]
        exclude: ^docker-compose\.(feature-tests|dex|dex-feature-tests)\.yml$
      - id: end-of-file-fixer
        exclude: webcaf/static|seed/
      - id: trailing-whitespace
        exclude: webcaf/static|seed/
  # Lint, sort imports and format. Replaces isort, black and flake8.
  # Configuration lives in pyproject.toml under [tool.ruff].
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
        exclude: webcaf/static|seed/
      - id: ruff-format
        # ruff-format also formats markdown by default; Black only formatted
        # Python, so keep the same scope.
        types_or: [python, pyi]
        exclude: webcaf/static|seed/
      # Check-only variants for `make lint`. In the manual stage, so they never
      # run on commit or in CI, and they use the same pinned Ruff version.
      - id: ruff-check
        alias: ruff-check-only
        name: ruff check (no fixes)
        args: [--no-fix]
        types_or: [python, pyi]
        exclude: webcaf/static|seed/
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-check
        name: ruff format (check only)
        args: [--check]
        types_or: [python, pyi]
        exclude: webcaf/static|seed/
        stages: [manual]
  # https://gds-way.cloudapps.digital/standards/pre-commit-hooks.html
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (^\.github/workflows/)|package\.lock\.json|(^tests/fixtures/)|webcaf/static|seed/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        exclude: wsgi.py
        verbose: true
        entry: .hooks/mypy-wrapper.sh
        args: [ --pretty ]
        additional_dependencies:
          - types-six
          - 'django-stubs==5.2.9'
          - django-environ
          - psycopg2-binary
          - govuk-frontend-django
          - django-storages
          - django-cors-headers
          - notifications-python-client
          - markdown
          - types-Markdown
          - django-csp
          - pyyaml
          - mozilla_django_oidc
          - govuk-onelogin-django
          - django-multiselectfield
          - openpyxl
          - python-dotenv
          - django-simple-history
          - django-axes
          - 'sentry-sdk[django]'
          - 'weasyprint>=66,<67'
          - django-otp
