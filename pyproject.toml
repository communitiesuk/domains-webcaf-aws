[project]
name = "webcaf"
version = "0.1.0"
description = "GOVUK webcaf"
authors = [
    { name = "Cyber and domain protection team" }
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (>=5.2.17,<5.3)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "django-csp (>=4.0,<5.0)",
    "govuk-frontend-django (>=0.22.0,<0.23.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "mozilla-django-oidc (>=5.0.2,<6.0.0)",
    "govuk-onelogin-django (>=0.5.0,<0.6.0)",
    "django-multiselectfield (>=1.0.1,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "django-simple-history (>=3.13.0,<4.0.0)",
    "django-axes (>=8.3.1,<9.0.0)",
    "weasyprint (>=70.0,<71.0)",
    "sentry-sdk[django] (>=2.71.0,<3.0.0)",
    "django-otp (>=1.7.3,<2.0.0)",
    "notifications-python-client (>=12.2.0,<13.0.0)",
    "fonttools (>=4.66.1,<5)",
    "pypdf (>=6.19.0,<7)",
    "charset-normalizer (>=3.5.2,<4.0.0)",
    "boto3 (>=1.43.108,<2.0.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
ipdb = "^0.13.13"
web-pdb = "^2.0.1"
types-markdown = "^3.10.2.20260712"
parameterized = "^0.9.0"
django-stubs = { extras = ["compatible-mypy"], version = ">=5.2.9,<5.3" }
playwright = "^1.63.0"
pytest-playwright = "^0.9.0"
behave = "^1.3.3"
ruamel-yaml = "^0.19.1"
behave-html-formatter = "^0.9.10"
freezegun = "^1.5.5"
pytest = "^9.1.1"
pytest-django = "^4.14.0"
pytest-html = "^4.2.0"
boto3-stubs = "^1.43.108"

[tool.ruff]
# https://gds-way.cloudapps.digital/manuals/programming-languages/python/python.html#maximum-line-length-of-120-characters
line-length = 120
# Ruff only writes syntax valid for this version. Kept below the runtime
# (Python 3.14) on purpose: a py314 target rewrites `except (A, B):` into the
# 3.14-only `except A, B:` form across the codebase.
target-version = "py312"
extend-exclude = [
    "venv*",
    "cache",
    "seed",
    "webcaf/static",
    "wsgi.py",
    "asgi.py",
]

[tool.ruff.lint]
# E/W/F and mccabe reproduce the previous Flake8 setup; I sorts imports,
# replacing isort. Further rules (e.g. B, G from the MHCLG Way) are left for a
# separate change so this migration stays like-for-like.
select = ["E", "W", "F", "C90", "I"]
ignore = [
    # Whitespace before ':' in a slice. The formatter owns this whitespace.
    "E203",
    # Line too long. The formatter wraps what it can; the rest is deliberate.
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.isort]
known-first-party = ["webcaf", "features", "tests"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "."
plugins = ['mypy_django_plugin.main']

[tool.django-stubs]
django_settings_module = "webcaf.settings"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.dependencies]
# Disallow the problamatic versions that have the vulnerability
litellm = "!=1.82.7, !=1.82.8"
