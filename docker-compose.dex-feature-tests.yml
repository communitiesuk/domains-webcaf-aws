services:
  oauth:
    image: !reset null
    build:
      context: .
      dockerfile: Dockerfile-dex-feature-tests
    ports: !override []
    volumes: !override []
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5556/healthz" ]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    environment:
      SSO_MODE: dex
      OVERRIDE_SSO_HOST: oauth
      OVERRIDE_APP_HOST: web
      LOGOUT_REDIRECT_URL: http://web:8000/

  feature-tests:
    environment:
      SSO_MODE: dex
      OVERRIDE_SSO_HOST: oauth
      OVERRIDE_APP_HOST: web
      ONE_LOGIN_SIMULATOR_URL: ""
    depends_on: !override
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      oauth:
        condition: service_healthy
